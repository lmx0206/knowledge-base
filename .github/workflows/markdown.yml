name: Markdown Quality

on:
  push:
    branches: [main]
    paths: ['**/*.md']
  pull_request:
    branches: [main]
    paths: ['**/*.md']
  schedule:
    # 每周一 9:37 跑链接检查（检测链接腐烂）
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            #node_modules

  references:
    name: Check References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check reference sections
        run: bash scripts/check-references.sh

  links:
    name: Check Links
    # 仅在定时任务、PR 和手动触发时运行（链接检查较慢）
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check markdown links
        uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: 'mlc_config.json'
